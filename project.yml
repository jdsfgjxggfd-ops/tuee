name: MyFirstApp
options:
  bundleIdPrefix: com.tenban
  deploymentTarget:
    iOS: "26.0"
targets:
  MyFirstApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenban.myfirstapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "30"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
